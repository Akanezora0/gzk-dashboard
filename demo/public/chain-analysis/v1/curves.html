</style><main><header><div class="eyebrow">基金支持与技术供给 · 年度变化</div><h1>七大技术方向的投入与成果演进</h1><p>2017—2025年 · 2017—2022年立项项目队列 · 在研资助规模、当年论文与当年专利申请</p><p id="explain">各条曲线以自身九年峰值为100，比较变化节奏与峰值位置。</p></header><div class="toolbar"><label>显示方式 <select id="mode"><option value="index">相对走势 · 峰值=100</option><option value="raw">原始数值 · 双纵轴</option></select></label><button id="wide">全部设为宽幅 1100 × 500</button><button id="compact">全部设为紧凑 820 × 450</button><span>可拖动每张图右下角调整大小，也可输入宽高；导出图片仅包含图表。</span></div><div class="cards"></div></main><script id="data" type="application/json">{"years": [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "layers": [{"id": "AI7", "name": "模型评测与安全", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}, {"id": "AI6", "name": "数据与知识服务", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}, {"id": "AI2", "name": "模型训练、适配与推理", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}, {"id": "AI1", "name": "基础模型与架构", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}, {"id": "AI3", "name": "AI算力与运行优化", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}, {"id": "AI4", "name": "AI云与平台服务", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}, {"id": "AI5", "name": "知识增强与AI应用", "funding": [30, 60, 90, 120, 150, 180, 210, 240, 270], "papers": [15, 30, 45, 60, 75, 90, 105, 120, 135], "patents": [5, 10, 15, 20, 25, 30, 35, 40, 45]}], "cohort_projects": 20, "units": {"funding": "万元", "papers": "篇", "patents": "件"}, "funding_definition": "同一项目队列在各执行年份的批准经费总额", "paper_definition": "当年发表的关联论文", "patent_definition": "按申请年统计独立申请号；已识别技术点按新分类汇总，余者保留已有宽口径七类归属；跨大类等额分摊", "normalization": "各技术层各指标的2017—2025峰值设为100；零序列保持0", "note": "合成样例 · 仅用于界面设计与动画测试"}</script><script>
const DATA=JSON.parse(document.querySelector('#data').textContent),years=DATA.years,colors=['#b2607d','#557b9a','#3582a8','#a51d42','#318b79','#9071ad','#b58635'],curves=[{key:'funding',name:'在研资助规模',color:'#a52245',dash:'',unit:'万元'},{key:'papers',name:'当年论文',color:'#347ea7',dash:'7 4',unit:'篇'},{key:'patents',name:'当年专利申请',color:'#b58a31',dash:'2 4',unit:'件'}],cards=[];let mode='index';const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},text){let e=document.createElementNS(NS,tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}function nice(v){if(v<=0)return 1;let p=10**Math.floor(Math.log10(v)),x=v/p;return (x<=1?1:x<=2?2:x<=5?5:10)*p}function fmt(v){return new Intl.NumberFormat('zh-CN',{maximumFractionDigits:1}).format(v)}
function draw(c){let {svg,layer,theme,panel}=c,w=panel.clientWidth,h=panel.clientHeight;svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('xmlns',NS);svg.setAttribute('role','img');svg.setAttribute('aria-label',layer.name+'，2017至2025年度投入与产出');svg.append(el('rect',{width:w,height:h,fill:'#fff',rx:13}),el('rect',{width:w,height:6,fill:theme}),el('text',{x:26,y:41,fill:theme,'font-size':20,'font-weight':650},layer.name));svg.append(el('text',{x:26,y:64,fill:'#8a96a1','font-size':11},'2017—2025 · '+(mode==='index'?'相对走势（各指标峰值=100）':'原始数值（经费左轴，成果右轴）')));
 let lx=26,ly=91;curves.forEach(k=>{svg.append(el('line',{x1:lx,y1:ly-4,x2:lx+24,y2:ly-4,stroke:k.color,'stroke-width':2.5,'stroke-dasharray':k.dash}),el('text',{x:lx+31,y:ly,fill:'#576774','font-size':11},k.name));lx+=k.key==='funding'?142:126});
 const L=68,R=mode==='raw'?76:34,T=128,B=68,pw=w-L-R,ph=h-T-B;let leftMax=mode==='index'?100:nice(Math.max(...layer.funding)),rightMax=mode==='index'?100:nice(Math.max(...layer.papers,...layer.patents));
 svg.append(el('text',{x:L,y:T-15,fill:'#82909d','font-size':10},mode==='index'?'相对规模':'批准经费（万元）'));if(mode==='raw')svg.append(el('text',{x:w-R,y:T-15,'text-anchor':'end',fill:'#82909d','font-size':10},'论文（篇）／专利（件）'));
 for(let i=0;i<=4;i++){let y=T+ph-i*ph/4;svg.append(el('line',{x1:L,y1:y,x2:w-R,y2:y,stroke:i===0?'#cdd6df':'#eaf0f4','stroke-width':1}),el('text',{x:L-12,y:y+4,'text-anchor':'end',fill:'#8897a4','font-size':10},fmt(leftMax*i/4)));if(mode==='raw')svg.append(el('text',{x:w-R+10,y:y+4,fill:'#8897a4','font-size':10},fmt(rightMax*i/4)))}
 years.forEach((yr,i)=>svg.append(el('text',{x:L+pw*i/8,y:T+ph+24,'text-anchor':'middle',fill:'#7f909d','font-size':11},yr)));
 curves.forEach(k=>{let max=Math.max(...layer[k.key]),vals=layer[k.key].map(v=>mode==='index'?(max?v/max*100:0):v),scale=k.key==='funding'?leftMax:rightMax,points=vals.map((v,i)=>[L+pw*i/8,T+ph-v/scale*ph]);svg.append(el('path',{d:points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)).join(' '),fill:'none',stroke:k.color,'stroke-width':2.6,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':k.dash}));points.forEach(([x,y],i)=>{let mark=k.key==='funding'?el('rect',{x:x-3,y:y-3,width:6,height:6,fill:k.color,rx:1}):k.key==='papers'?el('circle',{cx:x,cy:y,r:3.4,fill:'#fff',stroke:k.color,'stroke-width':2}):el('path',{d:`M${x},${y-4}l4,4 -4,4 -4,-4Z`,fill:k.color});svg.append(mark)})});
 svg.append(el('text',{x:L,y:h-17,fill:'#9ba6af','font-size':9.5},'2017—2022年立项项目队列 · 在研批准经费 / 当年论文 / 当年专利申请 · 跨方向分摊'));

 c.w.value=Math.round(w);c.h.value=Math.round(h)}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function exportChart(c,png){let clone=c.svg.cloneNode(true);clone.setAttribute('width',c.panel.clientWidth);clone.setAttribute('height',c.panel.clientHeight);clone.style.fontFamily='Microsoft YaHei, Noto Sans CJK SC, sans-serif';let text=new XMLSerializer().serializeToString(clone),blob=new Blob([text],{type:'image/svg+xml;charset=utf-8'}),name=c.layer.name+'_2017-2025';if(!png){download(blob,name+'.svg');return}let u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let canvas=document.createElement('canvas');canvas.width=c.panel.clientWidth*2;canvas.height=c.panel.clientHeight*2;canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);canvas.toBlob(b=>download(b,name+'.png'));URL.revokeObjectURL(u)};im.src=u}
DATA.layers.forEach((layer,i)=>{let item=document.createElement('section');item.className='item';let controls=document.createElement('div');controls.className='controls';controls.innerHTML=`<label>宽 <input aria-label="${layer.name}宽度" type="number" min="480" max="2400" step="20" value="820"></label><label>高 <input aria-label="${layer.name}高度" type="number" min="320" max="1400" step="20" value="450"></label><button class="apply">应用尺寸</button><button class="png">导出 PNG</button><button class="svg">导出 SVG</button>`;let panel=document.createElement('div');panel.className='panel';let svg=el('svg');panel.append(svg);item.append(controls,panel);document.querySelector('.cards').append(item);let inputs=controls.querySelectorAll('input');let c={layer,theme:colors[i],panel,svg,w:inputs[0],h:inputs[1]};controls.querySelector('.apply').onclick=()=>{panel.style.width=Math.max(480,Math.min(2400,+c.w.value||820))+'px';panel.style.height=Math.max(320,Math.min(1400,+c.h.value||450))+'px'};controls.querySelector('.png').onclick=()=>exportChart(c,true);controls.querySelector('.svg').onclick=()=>exportChart(c,false);new ResizeObserver(()=>draw(c)).observe(panel);cards.push(c);draw(c)});
document.querySelector('#mode').onchange=e=>{mode=e.target.value;document.querySelector('#explain').textContent=mode==='index'?'各条曲线以自身九年峰值为100，比较变化节奏与峰值位置。':'经费使用左侧纵轴，论文与专利数量使用右侧纵轴；各方向均采用年度值。';cards.forEach(draw)};function resizeAll(w,h){cards.forEach(c=>{c.panel.style.width=w+'px';c.panel.style.height=h+'px'})}document.querySelector('#wide').onclick=()=>resizeAll(1100,500);document.querySelector('#compact').onclick=()=>resizeAll(820,450);window.chartData=DATA;
